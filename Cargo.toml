[package]
name = "lyceumnstubot"
version = "2.0.1"
edition = "2021"
license = "MIT"
homepage = "https://github.com/tapnisu/lyceumnstubot"
repository = "https://github.com/tapnisu/lyceumnstubot"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
dotenv = "0.15"
itertools = "0.14"
log = "0.4"
pretty_env_logger = "0.5"
regex = "1.11"
reqwest = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
teloxide = { version = "0.15", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
